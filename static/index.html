<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitor do Torno CNC</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Projeto escolar</p>
      <h1>Monitor do Torno CNC</h1>
      <p>Envie o desenho da peça em PDF para exibi-lo neste monitor.</p>
    </header>

    <section class="upload-card" aria-labelledby="upload-title">
      <h2 id="upload-title">Enviar projeto</h2>
      <form id="upload-form">
        <label for="pdf-file">Arquivo do projeto (PDF, até 50 MB)</label>
        <input id="pdf-file" name="arquivo" type="file" accept="application/pdf,.pdf" required>
        <button id="upload-button" type="submit">Enviar PDF</button>
      </form>
      <p id="status" role="status" aria-live="polite">Nenhum projeto carregado.</p>
    </section>

    <section class="viewer-card" aria-labelledby="viewer-title">
      <div class="viewer-heading">
        <h2 id="viewer-title">Projeto da peça</h2>
        <button id="refresh-button" class="secondary-button" type="button">Atualizar</button>
      </div>
      <iframe id="pdf-viewer" title="Visualização do projeto em PDF"></iframe>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
